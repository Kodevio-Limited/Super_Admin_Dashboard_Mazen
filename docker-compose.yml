services:
  super-admin-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    container_name: super_admin_dashboard
    restart: unless-stopped
    expose:
      - "3003"
    ports:
      - "3003:3003"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3003/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.http.routers.superadmin.rule=Host(`superadmin.codevio.com`) || Host(`superadmin.codepay.com`) || Host(`superadmindashboard.com`) || Host(`superadmin-dashboard.codevio.com`)
      - traefik.http.routers.superadmin.entrypoints=websecure
      - traefik.http.routers.superadmin.tls.certResolver=letsencrypt
      - traefik.http.routers.superadmin-http.rule=Host(`superadmin.codevio.com`) || Host(`superadmin.codepay.com`) || Host(`superadmindashboard.com`) || Host(`superadmin-dashboard.codevio.com`)
      - traefik.http.routers.superadmin-http.entrypoints=web
      - traefik.http.routers.superadmin-http.middlewares=redirect-to-https
      - traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https
      - traefik.http.middlewares.redirect-to-https.redirectscheme.permanent=true
      - traefik.docker.network=dokploy-network
      - traefik.http.services.superadmin.loadbalancer.server.port=3003

networks:
  dokploy-network:
    external: true
